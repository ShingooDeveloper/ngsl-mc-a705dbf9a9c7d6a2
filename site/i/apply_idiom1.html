<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>apply to — 熟語帳（マイクラ版）</title>
<link rel="stylesheet" href="../style.css?v=2">
<style>body{padding:0}.wrap{padding:20px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.botbar{margin-top:28px;margin-bottom:0;padding-top:16px;border-top:1px solid var(--line)}
.markbar{display:inline-flex;gap:8px;flex-wrap:wrap}
.markbtn{font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;border:1.5px solid var(--line);color:var(--sub);background:transparent;border-radius:999px;padding:5px 15px;line-height:1.5}
.markbtn:hover{border-color:currentColor}
.markbtn.done.on{border-color:#059669;color:#fff;background:#059669}
.markbtn.star.on{border-color:#eab308;color:#7a5c00;background:#fef9c3}</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><a class="backlink" href="../idioms.html">← 熟語一覧にもどる</a><span class="markbar top"><button class="markbtn done" onclick="toggleMark('done')">✓ 覚えた</button><button class="markbtn star" onclick="toggleMark('star')">★ ブックマーク</button></span></div>
<section class="word" style="--wc:#7c3aed">
<div class="wordhead"><h2>apply to</h2><span class="pos">熟語</span></div>
<ol class="meanings"><li>～に当てはまる、効く</li></ol>
<h3 class="sec mc">⛏️ マインクラフト例文</h3>
<article class="ex mcx">
<p class="en"><span class="num">⛏</span>Does the Frost Walker effect <mark>apply</mark> to lava?</p>
<p class="ja">フロストウォーカーエンチャントは溶岩に当てはまりますか？</p>
<span class="player"><audio class="norm" preload="none" src="../../audio/apply_idiom1.mp3"></audio><audio class="slow" preload="none" src="../../audio/apply_idiom1_slow.mp3"></audio><button onclick="play(this,'n')" title="通常速度で再生">▶ 再生</button><button onclick="play(this,'s')" title="ゆっくり丁寧に読んだ別録音を再生（弱形の潰れ方が緩やか）">🐢 ゆっくり</button></span>
<div class="ipa-line">/dʌz ðə ˈfrɔst ˌwɔkər ɪˈfɛkt əˈplaɪ tə ˈlɑvə/</div>
<ul class="link"><li>the は弱形 /ðə/ ザ</li><li>to は弱形 /tə/ タ</li></ul>
<div class="kana">ダズ ザ フロスト ウォーカー イフェクト アプライ タ ラーバ</div>
</article>
<p style="margin-top:22px;font-size:.9rem"><a class="backlink" href="../w/apply.html">→ 見出し語「apply」のページも見る</a></p>
</section>
<div class="topbar botbar"><a class="backlink" href="../idioms.html">← 熟語一覧にもどる</a><span class="markbar "><button class="markbtn done" onclick="toggleMark('done')">✓ 覚えた</button><button class="markbtn star" onclick="toggleMark('star')">★ ブックマーク</button></span></div>
</div>
<script>
function play(b, which) {
  document.querySelectorAll('audio').forEach(function (a) { a.pause(); });
  document.querySelectorAll('.player button').forEach(function (x) { x.classList.remove('playing'); });
  var p = b.parentElement;
  var a;
  if (which === 's' && p.querySelector('audio.slow')) {
    a = p.querySelector('audio.slow');
    a.playbackRate = 1;
  } else {
    a = p.querySelector('audio.norm');
    a.playbackRate = which === 's' ? 0.7 : 1;
    if ('preservesPitch' in a) a.preservesPitch = true;
  }
  a.currentTime = 0;
  a.onended = function () { b.classList.remove('playing'); };
  b.classList.add('playing');
  a.play();
}
var W="apply_idiom1";
var LS_DONE='ngslmc_idiom_done', LS_STAR='ngslmc_idiom_star';
function setArr(s){ var a=[]; s.forEach(function(v){ a.push(v); }); return a; }
function loadSet(k){ try{ return new Set(JSON.parse(localStorage.getItem(k)||'[]')); }catch(e){ return new Set(); } }
function saveSet(k,s){ try{ localStorage.setItem(k, JSON.stringify(setArr(s))); }catch(e){} }
var doneSet=loadSet(LS_DONE), starSet=loadSet(LS_STAR);
function reflectMarks(){
  document.querySelectorAll('.markbtn.done').forEach(function(b){ b.classList.toggle('on', doneSet.has(W)); });
  document.querySelectorAll('.markbtn.star').forEach(function(b){ b.classList.toggle('on', starSet.has(W)); });
}
function toggleMark(kind){
  var set = kind==='done'?doneSet:starSet, key = kind==='done'?LS_DONE:LS_STAR;
  if(set.has(W)) set.delete(W); else set.add(W);
  saveSet(key,set); reflectMarks();
}
reflectMarks();</script>
</body>
</html>
